name: 'SwiftAtlas Retain Cycle Check'
description: 'Analyzes a Swift package with SwiftAtlas and fails the check if a potential retain cycle is detected.'

inputs:
  path:
    description: 'Path to the Swift package to analyze, relative to the workspace.'
    required: false
    default: '.'
  github-token:
    description: 'GitHub token used to post a PR comment with the results. Omit to skip commenting.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Build SwiftAtlas
      shell: bash
      run: swift build --package-path "${{ github.action_path }}/SwiftAtlas"

    - name: Run SwiftAtlas
      id: swiftatlas
      shell: bash
      run: |
        set +e
        OUTPUT="$("${{ github.action_path }}/SwiftAtlas/.build/debug/swiftatlas" "${{ github.workspace }}/${{ inputs.path }}" 2>&1)"
        STATUS=$?
        set -e

        echo "$OUTPUT"

        {
          echo "report<<SWIFTATLAS_EOF"
          echo "$OUTPUT"
          echo "SWIFTATLAS_EOF"
        } >> "$GITHUB_OUTPUT"

        exit $STATUS

    - name: Comment on pull request
      if: ${{ always() && inputs.github-token != '' && github.event_name == 'pull_request' && steps.swiftatlas.outcome != '' }}
      uses: actions/github-script@v7
      continue-on-error: true
      env:
        SWIFTATLAS_REPORT: ${{ steps.swiftatlas.outputs.report }}
        SWIFTATLAS_OUTCOME: ${{ steps.swiftatlas.outcome }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = '<!-- swiftatlas-retain-cycle-check -->';
          const report = process.env.SWIFTATLAS_REPORT || '';
          const status = process.env.SWIFTATLAS_OUTCOME === 'success'
            ? 'No potential retain cycles detected.'
            : 'Potential retain cycle(s) detected — see below.';
          const body = `${marker}\n### SwiftAtlas Retain Cycle Check\n\n${status}\n\n\`\`\`\n${report}\n\`\`\`\n`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
